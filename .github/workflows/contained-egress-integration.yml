name: contained-egress-integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify actual network namespace containment
        run: bash scripts/test-egress-integration.sh
      - name: Verify disposable no-network container hardening
        run: bash scripts/test-runner-hardening.sh
      - name: Test exact fixture endpoint parsing
        run: python3 -B -m unittest discover -s security/fixture-team-guard -p 'test_*.py'
      - name: Verify separate synthetic team egress
        run: bash scripts/test-team-egress-fixture.sh
