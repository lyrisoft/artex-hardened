# Separate contained deployment: DO NOT combine with docker-compose.yml.
# Usage: docker compose -f docker-compose.contained.yml up -d --build
# All ARTEX traffic shares network-guard's network namespace; only guard has NET_ADMIN.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - artex_pgdata:/var/lib/postgresql/data
    networks:
      contained:
        ipv4_address: ${ARTEX_PG_IP:-172.30.137.10}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
  network-guard:
    build:
      context: .
      dockerfile: security/network-guard/Dockerfile
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    environment:
      ARTEX_TARGET_CIDRS: ${ARTEX_TARGET_CIDRS:?Set approved IPv4 CIDRs}
      ARTEX_PG_IP: ${ARTEX_PG_IP:-172.30.137.10}
      ARTEX_BROKER_IP: ${ARTEX_BROKER_IP:-}
      ARTEX_ALLOW_DNS: ${ARTEX_ALLOW_DNS:-0}
    networks: [contained]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD", "test", "-f", "/run/network-guard-ready"]
      interval: 3s
      retries: 10
    restart: unless-stopped
  artex:
    build:
      context: .
    image: artex-hardened:local
    network_mode: "service:network-guard"
    extra_hosts:
      - "postgres:${ARTEX_PG_IP:-172.30.137.10}"
    depends_on:
      network-guard:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 256
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_JWT_KEY_DIR: /app/keys
      ARTEX_SECURITY_PROFILE: ${ARTEX_SECURITY_PROFILE:-pentest}
      ARTEX_ADVANCED_LAB_ACK: ${ARTEX_ADVANCED_LAB_ACK:-}
      ARTEX_UNTRUSTED_BOUNDARY: "1"
      ARTEX_UPDATE_CHECK: "0"
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
      - ./skills:/app/skills:ro
    restart: unless-stopped
networks:
  contained:
    driver: bridge
    ipam:
      config:
        - subnet: ${ARTEX_LAB_SUBNET:-172.30.137.0/24}
volumes:
  artex_pgdata:
